name: Liberar stock de pedidos vencidos

# Anula los pedidos sin pagar que ya vencieron (Yape/Plin sin captura a las 2 horas, tarjeta a los 60 minutos) y
# devuelve sus prendas al stock. Vercel Hobby solo deja un cron al día (vercel.json, que sigue de respaldo); este
# corre cada 15 minutos. No usa secretos: la tienda verifica el token OIDC que firma GitHub
# (src/server/services/github-actions-auth.ts). Los logs del repo son públicos: no se imprime la respuesta.
on:
  schedule:
    # Fuera del minuto 0, que es cuando GitHub tiene más cola y más atrasa los horarios.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: expirar-pedidos
  cancel-in-progress: false

jobs:
  expirar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: https://twentymoda.vercel.app
    steps:
      - name: Llamar al cron de la tienda
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=twentymoda-cron" | jq -r .value)
          echo "::add-mask::$token"
          status=$(curl -sS --retry 2 --max-time 60 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" "$SITE_URL/api/cron/expirar-pedidos")
          echo "Respuesta: $status"
          test "$status" = 200
